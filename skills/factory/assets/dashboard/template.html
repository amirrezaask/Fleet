<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'self'"
    />
    <title>Factory dashboard</title>
    <script>
      try {
        var t = localStorage.getItem("factory-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <style>
      <!--CSS-->
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The Factory dashboard needs JavaScript.</noscript>
    <script>
      <!--JS-->
    </script>
  </body>
</html>
