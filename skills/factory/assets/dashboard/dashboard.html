  --st-blocked: #b7791f;

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
::selection {
  background: var(--selection);
}
:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 3px;
  border-radius: var(--radius-md);
}
.reader {
  overflow-wrap: anywhere;
  font-size: 16px;
  line-height: 1.7;
  color: var(--foreground);
}
.reader > * {
  max-width: 72ch;
}
.reader > :first-child {
  margin-top: 0;
}
.reader h1, .reader h2, .reader h3, .reader h4 {
  font-family: var(--font-serif);
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: -0.005em;
  margin: 2em 0 0.6em;
}
.reader h1 {
  font-size: 1.75rem;
}
.reader h2 {
  font-size: 1.4rem;
  padding-bottom: 0.35em;
  border-bottom: 1px solid var(--border);
}
.reader h3 {
  font-size: 1.15rem;
}
.reader h4 {
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted-foreground);
}
.reader p, .reader ul, .reader ol, .reader pre, .reader table, .reader blockquote {
  margin: 1em 0;
}
.reader ul {
  list-style: disc;
  padding-left: 1.4em;
}
.reader ol {
  list-style: decimal;
  padding-left: 1.4em;
}
.reader li {
  margin: 0.3em 0;
}
.reader li::marker {
  color: var(--faint);
}
.reader li > ul, .reader li > ol {
  margin: 0.3em 0;
}
.reader ul:has(> li > input[type="checkbox"]) {
  list-style: none;
  padding-left: 0.2em;
}
.reader input[type="checkbox"] {
  accent-color: var(--clay);
  margin-right: 0.5em;
  translate: 0 1px;
}
.reader a {
  color: var(--clay-ink);
  text-decoration: underline;
  text-decoration-color: var(--clay);
  @supports (color: color-mix(in lab, red, red)) {
    text-decoration-color: color-mix(in srgb, var(--clay) 40%, transparent);
  }
  text-underline-offset: 0.2em;
}
.reader a:hover {
  text-decoration-color: var(--clay);
}
.reader strong {
  font-weight: 600;
}
.reader code {
  font-family: var(--font-mono);
  font-size: 0.86em;
  background: var(--muted);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0.1em 0.35em;
}
.reader pre {
  font-family: var(--font-mono);
  font-size: 0.84rem;
  line-height: 1.6;
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  overflow: auto;
}
.reader pre code {
  background: none;
  border: 0;
  padding: 0;
  font-size: inherit;
}
.reader table {
  border-collapse: separate;
  border-spacing: 0;
  display: block;
  overflow: auto;
  font-size: 0.9rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.reader th, .reader td {
  padding: 0.55rem 0.85rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.reader th {
  background: var(--surface-sunken);
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--muted-foreground);
}
.reader tr:last-child td {
  border-bottom: 0;
}
.reader blockquote {
  border-left: 3px solid var(--clay-tint);
  padding: 0.1em 0 0.1em 1rem;
  color: var(--muted-foreground);
}
.reader hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 2.5em 0;
}
@keyframes overlay-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes overlay-out {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}
@keyframes sheet-in {
  from {
    opacity: 0;
    transform: translateX(40px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes sheet-out {
  from {
    opacity: 1;
    transform: none;
  }
  to {
    opacity: 0;
    transform: translateX(28px) scale(0.99);
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes level-in {
  from {
    opacity: 0;
    transform: translateX(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes level-out {
  from {
    opacity: 0;
    transform: translateX(-14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes doc-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes view-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes task-ping {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.55;
  }
}
@keyframes pulse-dot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.3;
  }
}
.sheet-overlay[data-state="open"] {
  animation: overlay-in 220ms var(--ease) both;
}
.sheet-overlay[data-state="closed"] {
  animation: overlay-out 180ms var(--ease) both;
}
.sheet-content[data-state="open"] {
  animation: sheet-in 360ms var(--ease-out-strong) both;
}
.sheet-content[data-state="closed"] {
  animation: sheet-out 200ms var(--ease) both;
}
.rise {
  animation: rise 340ms var(--ease-out-strong) both;
  animation-delay: calc(var(--i, 0) * 40ms);
}
.sheet-content[data-state="open"] .rise {
  animation-delay: calc(120ms + var(--i, 0) * 45ms);
}
.level[data-dir="in"] {
  animation: level-in 220ms var(--ease-out-strong) both;
}
.level[data-dir="out"] {
  animation: level-out 220ms var(--ease-out-strong) both;
}
.doc-in {
  animation: doc-in 220ms var(--ease-out-strong) both;
}
.view-in {
  animation: view-in 160ms var(--ease);
}
.task-ping {
  animation: task-ping 2.4s ease-in-out infinite;
}
.pulse-dot {
  animation: pulse-dot 1.8s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}
