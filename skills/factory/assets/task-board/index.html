                  "border-b border-border text-meta text-muted-foreground max-md:hidden",
                )}
              >
                {daysSince(task.created) === null ? "" : `${daysSince(task.created)}d`}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function usePortfolio(projects: Board["projects"], refresh: number, enabled: boolean) {
  const [boards, setBoards] = React.useState<ReadonlyMap<string, Board | null> | null>(null);
  const ids = projects.map((project) => project.id).join();

  React.useEffect(() => {
    if (!enabled) return;

    const controller = new AbortController();

    Promise.all(
      projects.map(async (project): Promise<[string, Board | null]> => {
        try {
          const value = await request(`/api/board?project=${project.id}`, {
            signal: controller.signal,
          });

          return [project.id, Schema.decodeUnknownSync(boardSchema)(value)];
        } catch {
          return [project.id, null];
        }
      }),
    ).then((entries) => {
      if (!controller.signal.aborted) setBoards(new Map(entries));
    });

    return () => controller.abort();
  }, [ids, refresh, enabled]);

  return boards;
}

function PortfolioView({
  board,
  query,
  refresh,
  onSelectProject,
  onOpenAcross,
}: {
  board: Board;
  query: string;
  refresh: number;
  onSelectProject: (id: string) => void;
  onOpenAcross: (projectId: string, task: Task) => void;
}) {
  const boards = usePortfolio(board.projects, refresh, true);

  if (!boards) return <SkeletonRows />;

  const rows = board.projects
    .map((project) => {
      const loaded = boards.get(project.id) ?? null;
      const tasks = loaded?.tasks ?? [];

      return {
        project,
        loaded,
        tasks,
        blocked: tasks.filter((task) => task.status === "blocked"),
        active: tasks.filter((task) => task.status === "inprogress"),
      };
    })
    .sort(
      (a, b) =>
        b.blocked.length - a.blocked.length ||
        b.active.length - a.active.length ||
        a.project.name.localeCompare(b.project.name),
    );

  const count = (pick: "blocked" | "active") =>
    rows.reduce((sum, row) => sum + row[pick].length, 0);

  return (
    <div className="mx-auto max-w-[1100px] pt-4 pb-12">
      <p className="px-3 font-serif text-title text-balance">
        {rows.length} {rows.length === 1 ? "project" : "projects"}, {count("active")} in progress,{" "}
        {count("blocked")} blocked.
      </p>
      <ul className="mt-6 border-t border-border">
        {rows.map(({ project, loaded, tasks, blocked, active }) => {
          const attention = [...blocked, ...active].filter((task) => matches(task, query));

          return (
            <li
              key={project.id}
              data-portfolio-project={project.id}
              className="grid gap-x-8 gap-y-3 border-b border-border px-3 py-5 md:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]"
            >
              <div className="min-w-0">
                <button
                  type="button"
                  className="flex max-w-full cursor-pointer items-center gap-2 font-serif text-xl leading-tight decoration-clay/40 underline-offset-4 hover:underline"
                  onClick={() => onSelectProject(project.id)}
                >
                  {project.id === board.projectId ? (
                    <span className="size-1.5 shrink-0 rounded-full bg-clay" aria-hidden />
                  ) : null}
                  <span className="truncate">{project.name}</span>
                </button>
                <p className="mt-1 text-micro text-muted-foreground tabular-nums">
                  {!loaded
                    ? "Could not read this project."
                    : `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`}
                </p>
                {tasks.length ? (
                  <div
                    role="img"
                    aria-label={columns
                      .map(
                        (column) =>
                          `${tasks.filter((task) => task.status === column.id).length} ${column.label}`,
                      )
                      .join(", ")}
                    className="mt-3 flex flex-wrap gap-[3px]"
                  >
                    {defaultOrder.flatMap((status) =>
                      tasks
                        .filter((task) => task.status === status)
                        .map((task) => (
                          <span
                            key={task.id}
                            title={task.title}
                            className={cn("size-2.5 rounded-[3px]", statusFill[status])}
                          />
                        )),
                    )}
                  </div>
                ) : null}
              </div>
              <div className="min-w-0">
                {attention.length ? (
                  <ul className="space-y-1">
                    {attention.slice(0, 4).map((task) => (
                      <li key={task.id} className="flex items-center gap-2">
                        <StatusIcon status={task.status} />
                        <button
                          type="button"
                          title={task.title}
                          className="min-w-0 cursor-pointer truncate text-left text-sm decoration-clay/40 underline-offset-4 hover:underline"
                          onClick={() => onOpenAcross(project.id, task)}
                        >
                          {task.title}
                        </button>
                        {task.stage ? (
                          <span className="ml-auto shrink-0 text-micro text-muted-foreground capitalize">
                            {task.stage}
                          </span>
                        ) : null}
                      </li>
                    ))}
                    {attention.length > 4 ? (
                      <li className="pl-5.5 text-micro text-muted-foreground">
                        {attention.length - 4} more
                      </li>
                    ) : null}
                  </ul>
                ) : (
                  <p className="text-meta text-muted-foreground">
                    {query ? "No active tasks match." : "Nothing running."}
                  </p>
                )}
              </div>
            </li>
          );
        })}
      </ul>
    </div>
  );
}

    }
  }

  function chooseView(next: View) {
    setView(next);
    writeSetting("factory-view", next === "board" ? null : next);
  }

  function chooseOrder(next: readonly ColumnId[]) {
    setOrder(next);
    writeSetting("factory-columns", next.join() === defaultColumns.join() ? null : next.join());
  }

  function toggleHideDone() {
    setHideDone(!hideDone);
    writeSetting("factory-hide-done", hideDone ? null : "1");
  }

  function selectProject(id: string) {
    activeProject = id;

    try {
      localStorage.setItem("factory-project", id);
    } catch {
      // Selection still works for this page load without storage.
    }

    setSelected(null);
    setProjectId(id);
  }

  const form = (fields: Record<string, string>) => ({
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ token: board?.token ?? "", ...fields }),
  });

  async function removeProject(id: string) {
    try {
      const result = await request("/api/projects/remove", form({ id }));
      selectProject(id === board?.projectId ? (result.projects[0]?.id ?? "") : activeProject);
      setLiveKey((key) => key + 1);
    } catch {
      setError("Could not remove the project. Reload and try again.");
    }
  }

  // Resolves to a problem message, or "" when the project was added.
  async function addPath(path: string): Promise<string> {
    try {
      const result = await request("/api/projects/add", form({ path }));
      selectProject(result.id);
      setAnnouncement("Project added.");

      return "";
    } catch {
      return "Could not add that folder. Enter the path of an existing directory.";
    }
  }

  async function pickFolder() {
    if (picking || !board) return;
    const controller = new AbortController();
    pickAbort.current = controller;
    setPicking(true);
    setAnnouncement("Waiting for folder selection.");

    try {
      const result = await request("/api/projects/pick", {
        ...form({}),
        signal: controller.signal,
      });

      if (result.id) {
        selectProject(result.id);
        setAnnouncement("Project added.");
      } else if (result.unsupported) {
        setError("No native folder picker is available here. Use “Enter a path” instead.");
      } else setAnnouncement("Cancelled.");
    } catch {
      if (!controller.signal.aborted) setError("Could not open the folder dialog.");
    } finally {
      pickAbort.current = null;
      setPicking(false);
    }
  }

  React.useEffect(() => {
    const controller = new AbortController();
    request(api("/api/board"), { signal: controller.signal })
      .then((value) => {
        if (!controller.signal.aborted) {
          const data = Schema.decodeUnknownSync(boardSchema)(value);
          setBoard(data);
          setError("");

          activeProject = data.projectId;
          document.title = "Factory: " + (data.project || "Tasks");
        }
      })
      .catch(() => {
        if (controller.signal.aborted) return;

        // A remembered project may have been removed since; fall back to the first one.
        if (activeProject) selectProject("");
        else setError("Could not load the board. Reload to try again.");
      });

    return () => controller.abort();
  }, [liveKey, projectId]);
  React.useEffect(() => {
    // EventSource reconnects on its own; a "change" event means task files changed on disk.
    const events = new EventSource("/api/events");

    events.addEventListener("change", (event) => {
      let changed = "";

      try {
        changed = event instanceof MessageEvent ? JSON.parse(event.data).project : "";
      } catch {
        changed = "";
      }

      if (saving.current || pickedRef.current) return;

      setAnyKey((key) => key + 1);

      if (changed && changed !== activeProject) return;

      setLiveKey((key) => key + 1);
    });

    return () => events.close();
  }, []);

  React.useEffect(() => {
    const shortcut = (event: KeyboardEvent) => {
      if (event.metaKey || event.ctrlKey || event.altKey || event.defaultPrevented) return;

      if (document.querySelector('[role="dialog"]') || pickedRef.current) return;

      if (
        event.target instanceof HTMLElement &&
        event.target.matches("input, select, textarea, [contenteditable]")
      )
        return;

      if (event.key === "/") {
        event.preventDefault();
        filterRef.current?.focus();

        return;
      }

      const next = views[Number(event.key) - 1];

      if (next) chooseView(next.id);
    };

    window.addEventListener("keydown", shortcut);

    return () => window.removeEventListener("keydown", shortcut);
  }, []);

  function pick(value: Picked) {
    if (saving.current) return;
    pickedRef.current = value;
    setPicked(value);
    setError("");
    setAnnouncement(
      "Use left and right arrows to choose a column, Enter to save, Escape to cancel.",
    );
  }

  function target(status: Status) {
    const current = pickedRef.current;

    if (!current) return;
    const next = { ...current, target: status };
    pickedRef.current = next;
    setPicked(next);
    setAnnouncement("Destination: " + statusLabel(status));
  }

  function cancel() {
    pickedRef.current = null;
    setPicked(null);
  }

  async function move(id: string, status: Status) {
    const task = board?.tasks.find((task) => task.id === id);
    cancel();

    if (!board || !task || saving.current || task.status === status) return;
    saving.current = true;
    setPending(id);
    setError("");
    setAnnouncement("Saving task status…");

    try {
      const updated = Schema.decodeUnknownSync(taskSchema)(
        await request("/api/status", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            token: board.token,
            project: board.projectId,
            task: id,
            status,
          }),
        }),
      );

      setBoard((current) =>
        current
          ? { ...current, tasks: current.tasks.map((item) => (item.id === id ? updated : item)) }
          : current,
      );
      setAnnouncement("Task moved to " + statusLabel(status) + ".");
    } catch {
      setError(
        "Could not confirm the move. Your board is unchanged. Reload to check the saved status, then try again.",
      );
      setAnnouncement("Move failed.");
    } finally {
      saving.current = false;
      setPending(null);
      requestAnimationFrame(() =>
        document.querySelector<HTMLElement>(`[data-task="${id}"]`)?.focus(),
      );
    }
  }

  async function deleteTask(id: string) {
    if (!board) return;

    setError("");
    setAnnouncement("Deleting task…");

    try {
      await request("/api/tasks/delete", form({ project: board.projectId, task: id }));
      setBoard((current) =>
        current ? { ...current, tasks: current.tasks.filter((task) => task.id !== id) } : current,
      );
      setAnnouncement("Task deleted.");
    } catch {
      setError("Could not delete the task. Reload to check whether it still exists, then try again.");
      setAnnouncement("Delete failed.");
    }
  }

  async function deleteQueueItem(item: IndexedQueueItem) {
    if (!board) return;

    setError("");
    setAnnouncement("Deleting queue item…");

    try {
      const result = Schema.decodeUnknownSync(
        Schema.Struct({ backlog: Schema.Array(queueItemSchema) }),
      )(
        await request(
          "/api/queue/delete",
          form({ project: board.projectId, index: String(item.index), text: item.text }),
        ),
      );

      setBoard((current) => (current ? { ...current, backlog: result.backlog } : current));
      setAnnouncement("Queue item deleted.");
    } catch {
      setError("Could not delete the queue item. Reload the board and try again.");
      setAnnouncement("Delete failed.");
    }
  }

  // Any task title, card or queue item in the project's views offers the menu; Portfolio lists
  // other projects.
  function openContextMenu(event: React.MouseEvent) {
    if (selected || view === "portfolio" || !(event.target instanceof Element)) return;

    const element = event.target.closest<HTMLElement>(
      "[data-task],[data-open-task],[data-queue-index]",
    );

    const id = element?.dataset.task ?? element?.dataset.openTask;
    const index = Number(element?.dataset.queueIndex);
    const isTask = board?.tasks.some((task) => task.id === id) === true;
    const isQueue = Number.isInteger(index) && board?.backlog[index] !== undefined;

    if (!element || !(isTask || isQueue)) return;

    event.preventDefault();

    // The keyboard's context-menu key reports no pointer position.
    const box = element.getBoundingClientRect();
    const keyboard = event.clientX === 0 && event.clientY === 0;

    setMenu({
      ...(isTask ? { task: id } : { queue: index }),
      x: keyboard ? box.left : event.clientX,
      y: keyboard ? box.bottom : event.clientY,
    });
  }

  const menuTask = menu ? board?.tasks.find((task) => task.id === menu.task) : undefined;
  const queued = menu?.queue === undefined ? undefined : board?.backlog[menu.queue];
  const menuQueue = queued && menu?.queue !== undefined ? { ...queued, index: menu.queue } : undefined;

  const stale = board !== null && projectId !== "" && board.projectId !== projectId;
  const hasProjects = board !== null && board.projects.length > 0;
  // With no project the hidden board keeps its slot and the empty state explains what to do.
  const shownView: View = board && !hasProjects ? "board" : view;
  const blockedCount = board?.tasks.filter((task) => task.status === "blocked").length ?? 0;
  const filtered = (board?.tasks ?? []).filter((task) => matches(task, query));

  const queue = (board?.backlog ?? [])
    .map((item, index) => ({ ...item, index }))
    .filter((item) => matchesWords(`${item.text} ${item.context}`, query));

  const visible =
    hideDone && hideableViews.includes(shownView)
      ? filtered.filter((task) => task.status !== "done")
      : filtered;

  return (
    <div className="flex min-h-dvh">
      <ProjectSidebar
        board={board}
        picking={picking}
        open={navOpen}
        collapsed={collapsed}
        onToggleCollapsed={toggleCollapsed}
        onClose={() => setNavOpen(false)}
        onSelect={selectProject}
        onRemove={(id) => void removeProject(id)}
        onPick={() => void pickFolder()}
        onCancelPick={() => pickAbort.current?.abort()}
        onAddPath={addPath}
      />
      <main className="flex h-dvh min-w-0 flex-1 flex-col" onContextMenu={openContextMenu}>
        <header className="z-30 shrink-0 bg-background">
          <div className="flex flex-wrap items-center gap-x-5 gap-y-2 px-5 py-2.5 md:px-8 xl:flex-nowrap">
            <Button
              variant="ghost"
              size="icon"
              className="-ml-2 md:hidden"
              aria-label="Open projects"
              aria-expanded={navOpen}
              onClick={() => setNavOpen(true)}
            >
              <Menu />
            </Button>
            <div className="flex min-w-0 items-baseline gap-3">
              <h1 className="truncate font-serif text-xl leading-tight">
                {board?.project || "Factory"}
              </h1>
              {board && hasProjects ? (
                <span className="hidden text-meta whitespace-nowrap text-muted-foreground tabular-nums 2xl:inline">
                  {board.tasks.length} tasks ·{" "}
                  {board.tasks.filter((task) => task.status === "inprogress").length} in progress
                  {blockedCount ? ` · ${blockedCount} blocked` : ""}
                </span>
              ) : null}
            </div>
            {hasProjects ? (
              <div className="ml-auto flex max-w-full flex-wrap items-center gap-2 xl:shrink-0 xl:flex-nowrap">
                {view === "board" && order.join() !== defaultColumns.join() ? (
                  <Button variant="ghost" size="sm" onClick={() => chooseOrder(defaultColumns)}>
                    <RotateCcw aria-hidden />
                    Reset columns
                  </Button>
                ) : null}
                {hideableViews.includes(view) ? (
                  <Button
                    variant="ghost"
                    size="sm"
                    aria-pressed={hideDone}
                    onClick={toggleHideDone}
                  >
                    {hideDone ? "Show done" : "Hide done"}
                  </Button>
                ) : null}
                <label className="relative block">
                  <span className="sr-only">Filter tasks</span>
                  <Search
                    className="pointer-events-none absolute top-1/2 left-2.5 size-3.5 -translate-y-1/2 text-faint"
                    aria-hidden
                  />
                  <input
                    ref={filterRef}
                    type="search"
                    value={query}
                    placeholder="Filter"
                    aria-keyshortcuts="/"
                    onChange={(event) => setQuery(event.target.value)}
                    onKeyDown={(event) => {
                      if (event.key === "Escape") {
                        setQuery("");
                        event.currentTarget.blur();
                      }
                    }}
                    className="h-8 w-36 rounded-md border border-border bg-card pr-2 pl-8 text-meta placeholder:text-muted-foreground transition-[width] duration-150 ease-[var(--ease)] focus:w-52 focus:outline-none focus-visible:ring-2 focus-visible:ring-ring"
                  />
                </label>
                <ViewSwitcher view={view} onChange={chooseView} />
              </div>
            ) : null}
          </div>
          <StatusRibbon tasks={board?.tasks ?? []} />
        </header>
        <p id="move-instructions" className="sr-only">
          Drag cards between columns. On a card or move grip, press Space, use left/right arrows,
          and Enter to save or Escape to cancel. Right-click a card or press the context menu key to
          choose its status or delete it; queue items offer delete the same way.
        </p>
        <p id="column-instructions" className="sr-only">
          Drag a column by its header to reorder it. On the reorder grip, press Space, use left and
          right arrows, and Enter to drop or Escape to cancel.
        </p>
        <p role="status" aria-live="polite" className="sr-only">
          {announcement}
        </p>
        <div className="flex min-h-0 flex-1 flex-col px-5 pt-3 md:px-8">
          {error ? <Alert>{error}</Alert> : null}
          {board?.errors.map((message) => (
            <Alert key={message}>{message}</Alert>
          ))}
          {board && !hasProjects ? (
            <EmptyProjects
              picking={picking}
              onPick={() => void pickFolder()}
              onCancelPick={() => pickAbort.current?.abort()}
            />
          ) : null}
          <div
            key={shownView}
            className={cn(
              "view-in min-h-0 flex-1 transition-opacity",
              shownView === "board" || shownView === "timeline" || shownView === "table"
                ? "overflow-hidden"
                : "overflow-y-auto",
              shownView !== "board" && stale && "opacity-60",
            )}
          >
            {shownView === "board" ? (
              <BoardView
                board={board}
                tasks={filtered}
                queue={queue}
                stale={stale}
                busy={Boolean(pending)}
                order={order}
                picked={picked}
                pending={Boolean(pending)}
                boardRef={boardRef}
                canDrop={() => Boolean(pickedRef.current) && !saving.current}
                onDropCard={(status) => {
                  const current = pickedRef.current;

                  if (current) void move(current.id, status);

                  return Boolean(current);
                }}
                onOrder={chooseOrder}
                onAnnounce={setAnnouncement}
                onOpen={setSelected}
                onPick={pick}
                onTarget={target}
                onMove={(id, status) => void move(id, status)}
                onCancel={cancel}
              />
            ) : !board ? (
              <SkeletonRows />
            ) : shownView === "portfolio" ? (
              <PortfolioView
                board={board}
                query={query}
                refresh={anyKey + liveKey}
                onSelectProject={(id) => {
                  selectProject(id);
                  chooseView("board");
                }}
                onOpenAcross={(id, task) => {
                  selectProject(id);
                  setSelected(task);
                }}
              />
            ) : !visible.length ? (
              <Nothing query={query} onClear={() => setQuery("")} />
            ) : shownView === "pipeline" ? (
              <PipelineView tasks={visible} onOpen={setSelected} />
            ) : shownView === "focus" ? (
              <FocusView
                tasks={visible}
                pending={Boolean(pending)}
                onOpen={setSelected}
                onMove={(id, status) => void move(id, status)}
              />
            ) : shownView === "hill" ? (
              <HillView tasks={visible} onOpen={setSelected} />
            ) : shownView === "timeline" ? (
              <TimelineView tasks={visible} onOpen={setSelected} />
            ) : (
              <TableView
                tasks={visible}
                pending={Boolean(pending)}
                onOpen={setSelected}
                onMove={(id, status) => void move(id, status)}
              />
            )}
          </div>
        </div>
        <footer className="flex shrink-0 flex-wrap gap-x-6 gap-y-1 px-5 pt-1 pb-2.5 font-mono text-micro text-faint max-md:hidden md:px-8">
          <span>/factory intent &lt;request&gt;</span>
          <span>/factory next</span>
          <span>/factory design | plan | build | review</span>
        </footer>
        <TaskReader root={selected} onClose={() => setSelected(null)} liveKey={liveKey} />
      </main>
      {menu && menuTask ? (
        <StatusMenu
          key={menuTask.id}
          task={menuTask}
          x={menu.x}
          y={menu.y}
          onMove={(id, status) => void move(id, status)}
          onDelete={(id) => void deleteTask(id)}
          onClose={() => setMenu(null)}
        />
      ) : null}
      {menu && menuQueue ? (
        <QueueMenu
          key={`queue-${menuQueue.index}`}
          item={menuQueue}
          x={menu.x}
          y={menu.y}
          onDelete={() => void deleteQueueItem(menuQueue)}
          onClose={() => setMenu(null)}
        />
      ) : null}
    </div>
  );
}

const root = document.getElementById("root");

if (root) createRoot(root).render(<App />);
</script>
