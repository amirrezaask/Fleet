<div id="root"><p role="status" style="padding:40px">Loading project tasks…</p></div>
<noscript>This task board requires JavaScript.</noscript>

// shadcn/ui component source, adapted inline for this single-file UI.
// Source: https://github.com/shadcn-ui/ui (MIT); full notice below.
function cn(...values: ClassValue[]) {
  return twMerge(clsx(values));
}

const buttonVariants = cva(
  "inline-flex shrink-0 items-center justify-center gap-2 rounded-lg text-sm font-medium transition-[background-color,color,box-shadow] duration-150 ease-[var(--ease)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4",
  {
    variants: {
      variant: {
        default: "bg-primary text-primary-foreground hover:bg-primary/85",
        outline: "border border-border bg-card hover:bg-muted",
        ghost: "text-muted-foreground hover:bg-muted hover:text-foreground",
      },
      size: {
        default: "h-9 px-4",
        sm: "h-8 px-3 text-meta",
        icon: "size-9",
        iconSm: "size-7 rounded-md",
      },
    },
    defaultVariants: { variant: "default", size: "default" },
  },
);

function Button({
  className,
  variant,
  size,
  asChild = false,
  ...props
}: React.ComponentProps<"button"> & VariantProps<typeof buttonVariants> & { asChild?: boolean }) {
  const Component = asChild ? Slot : "button";

  return (
    <Component
      data-slot="button"
      className={cn(buttonVariants({ variant, size }), className)}
      {...props}
    />
  );
}

function Card({ className, ...props }: React.ComponentProps<"div">) {
  return (
    <div
      data-slot="card"
      className={cn("rounded-xl border border-border bg-card text-foreground", className)}
      {...props}
    />
  );
}

function DialogContent({
  children,
  ...props
}: React.ComponentProps<typeof DialogPrimitive.Content>) {
  return (
    <DialogPrimitive.Portal>
      <DialogPrimitive.Overlay className="dialog-overlay fixed inset-0 z-40 bg-[var(--overlay)]" />
      <DialogPrimitive.Content
        data-slot="dialog-content"
        className="dialog-content fixed top-1/2 left-1/2 z-50 flex h-[90dvh] w-[99vw] max-w-none -translate-x-1/2 -translate-y-1/2 flex-col overflow-hidden rounded-2xl border border-border bg-background shadow-dialog focus:outline-none max-md:h-dvh max-md:w-screen max-md:max-w-none max-md:rounded-none"
        {...props}

        {children}

  );
}

function TabsList(props: React.ComponentProps<typeof TabsPrimitive.List>) {

}

function TabsTrigger(props: React.ComponentProps<typeof TabsPrimitive.Trigger>) {

      data-slot="tabs-trigger"
      className="relative -mb-px inline-flex items-center gap-2 rounded-t-md border-b-2 border-transparent py-3.5 text-sm text-muted-foreground transition-colors hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none data-[state=active]:border-clay data-[state=active]:font-medium data-[state=active]:text-foreground"

}

function Alert({ children, onRetry }: { children: React.ReactNode; onRetry?: () => void }) {
  return (
    <div
      role="alert"
      className="mb-5 flex items-start gap-3 rounded-xl border border-st-blocked/30 bg-st-blocked-bg px-4 py-3 text-meta text-st-blocked-ink"

}

const statusSchema = Schema.Literals(["backlog", "inprogress", "blocked", "done"]);

const stages = ["intent", "design", "plan", "build", "review", "done"] as const;

const taskSchema = Schema.Struct({
  id: Schema.String,
  title: Schema.String,
  status: statusSchema,
  file: Schema.String,
  subtasks: Schema.Struct({ total: Schema.Number, done: Schema.Number }),
  created: Schema.String,
  updated: Schema.String,
  stage: Schema.optional(Schema.Literals(stages)),
  blocker: Schema.optional(Schema.String),
});

const queueItemSchema = Schema.Struct({
  taken: Schema.Boolean,
  text: Schema.String,
  task: Schema.String,
  context: Schema.String,
});

const boardSchema = Schema.Struct({
  project: Schema.String,
  projectId: Schema.String,
  projects: Schema.Array(
    Schema.Struct({ id: Schema.String, name: Schema.String, path: Schema.String }),
  ),
  token: Schema.String,
  tasks: Schema.Array(taskSchema),
  backlog: Schema.Array(queueItemSchema),
  errors: Schema.Array(Schema.String),
});

const documentsSchema = Schema.Struct({
  intent: Schema.String,
  design: Schema.String,
  plan: Schema.String,
  debrief: Schema.String,
  subtasks: Schema.Array(taskSchema),
  others: Schema.Array(Schema.Struct({ path: Schema.String, html: Schema.String })),
});

type Task = typeof taskSchema.Type;

type Board = typeof boardSchema.Type;

type Documents = typeof documentsSchema.Type;

type QueueItem = typeof queueItemSchema.Type;

// The item's position in backlog.md, kept through filtering so a delete names the right line.
type IndexedQueueItem = QueueItem & { index: number };

// A context menu opens on either a task or a queue item, at a viewport position.
type MenuTarget = { task?: string; queue?: number; x: number; y: number };

type Status = typeof statusSchema.Type;

const columns: { id: Status; label: string }[] = [
  { id: "backlog", label: "Backlog" },
  { id: "inprogress", label: "In progress" },
  { id: "blocked", label: "Blocked" },
  { id: "done", label: "Done" },
];

function statusLabel(status: Status) {
  return columns.find((column) => column.id === status)?.label ?? status;
}

type Stage = (typeof stages)[number];

const defaultOrder: readonly Status[] = columns.map((column) => column.id);

// The Queue column shows backlog.md lines; it is not a status, so cards cannot be dropped on it.
type ColumnId = "queue" | Status;

const defaultColumns: readonly ColumnId[] = ["queue", ...defaultOrder];

function columnLabel(id: ColumnId) {
  return id === "queue" ? "Queue" : statusLabel(id);
}

// Browser settings are conveniences: every reader and writer tolerates blocked storage.
function readSetting(key: string) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}

function writeSetting(key: string, value: string | null) {
  try {
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
  } catch {
    // The choice still applies to this page load.
  }
}

function readColumnOrder(): readonly ColumnId[] {
  const saved = (readSetting("factory-columns") ?? "").split(",");
  const named = saved.flatMap((part) => defaultColumns.filter((id) => id === part));
  // An order saved before the Queue column existed keeps its status columns.
  const order: readonly ColumnId[] = named.includes("queue") ? named : ["queue", ...named];

  return new Set(order).size === defaultColumns.length && order.length === defaultColumns.length
    ? order
    : defaultColumns;
}

function place(order: readonly ColumnId[], id: ColumnId, slot: number): readonly ColumnId[] {
  const rest = order.filter((column) => column !== id);

  return [...rest.slice(0, slot), id, ...rest.slice(slot)];
}

const views = [
  { id: "board", label: "Board", icon: Columns3 },
  { id: "pipeline", label: "Pipeline", icon: Workflow },
  { id: "focus", label: "Focus", icon: Crosshair },
  { id: "hill", label: "Hill", icon: Mountain },
  { id: "timeline", label: "Timeline", icon: ChartGantt },
  { id: "table", label: "Table", icon: Table2 },
  { id: "portfolio", label: "Portfolio", icon: LayoutGrid },
] as const;

type View = (typeof views)[number]["id"];

function readView(): View {
  const saved = readSetting("factory-view");

  return views.find((view) => view.id === saved)?.id ?? "board";
}

const dayMs = 86_400_000;

// Task dates are calendar days, so all arithmetic happens on whole UTC day numbers.
function dayNumber(date: string): number | null {
  const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date);

  if (!parts) return null;

  return Math.floor(Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3])) / dayMs);
}

function today() {
  const now = new Date();

  return Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / dayMs);
}

function daysSince(date: string): number | null {
  const day = dayNumber(date);

  return day === null ? null : today() - day;
}

function ago(date: string) {
  const days = daysSince(date);

  if (days === null) return "no date";

  if (days <= 0) return "today";

  if (days === 1) return "yesterday";

  if (days < 60) return `${days}d ago`;

  return `${Math.round(days / 30)}mo ago`;
}

function shortDay(day: number) {
  return new Date(day * dayMs).toLocaleDateString(undefined, {
    month: "short",
    day: "numeric",
    timeZone: "UTC",
  });
}

function taskNumber(task: Task) {
  return /^(\d+)-/.exec(task.id)?.[1] ?? "";
}

// A finished task has left the line, whatever stage its metadata last recorded.
function stageOf(task: Task): Stage | undefined {
  return task.status === "done" ? "done" : task.stage;
}

function matchesWords(text: string, query: string) {
  const haystack = text.toLowerCase();

  return query
    .toLowerCase()
    .split(/\s+/)
    .every((word) => haystack.includes(word));
}

function matches(task: Task, query: string) {
  return matchesWords(
    `${task.id} ${task.title} ${statusLabel(task.status)} ${task.stage ?? ""}`,
    query,
  );
}

const statusFill: Record<Status, string> = {
  backlog: "bg-st-backlog",
  inprogress: "bg-st-progress",
  blocked: "bg-st-blocked",
  done: "bg-st-done",
};

const statusRing: Record<Status, string> = {
  backlog: "border-st-backlog text-st-backlog-ink",
  inprogress: "border-st-progress text-st-progress-ink",
  blocked: "border-st-blocked text-st-blocked-ink",
  done: "border-st-done text-st-done-ink",
};

const attentionOrder: readonly Status[] = ["blocked", "inprogress", "backlog", "done"];

type Picked = { id: string; target: Status; keyboard: boolean };

type Gesture = {
  id: string;
  pointer: number;
  x: number;
  y: number;
  moved: boolean;
  target: Status | null;
};

// Every API call is scoped to the project selected in the header.
let activeProject = "";

try {
  activeProject = localStorage.getItem("factory-project") ?? "";
} catch {
  activeProject = "";
}

function api(path: string) {
  return activeProject ? `${path}${path.includes("?") ? "&" : "?"}project=${activeProject}` : path;
}

async function request(path: string, init?: RequestInit) {
  const response = await fetch(path, init);

  if (!response.ok) throw new Error("Request failed");

  return response.json();
}

function useMediaQuery(query: string) {
  return React.useSyncExternalStore(
    (notify) => {
      if (!("matchMedia" in window)) return () => {};

      const list = window.matchMedia(query);

      list.addEventListener("change", notify);

      return () => list.removeEventListener("change", notify);
    },
    () => "matchMedia" in window && window.matchMedia(query).matches,
    () => false,
  );
}

  total,

}: {

  total: number;
  className?: string;
}) {

  return (
    <span
      className={cn("inline-flex items-center gap-1.5 tabular-nums", className)}
      aria-label={`${done} of ${total} subtasks done`}
    >
      <span className="h-1 w-12 overflow-hidden rounded-full bg-muted">

          className={cn(
            "block h-full rounded-full transition-[width] duration-300",

      </span>
      {done}/{total}
    </span>
  );

function ProgressRing({ done, total }: { done: number; total: number }) {
  const r = 7;
  const c = 2 * Math.PI * r;

  return (
    <svg viewBox="0 0 18 18" className="size-[18px] -rotate-90" aria-hidden>
      <circle cx="9" cy="9" r={r} fill="none" stroke="var(--muted)" strokeWidth="2.25" />
      <circle
        cx="9"
        cy="9"
        r={r}
        fill="none"
        stroke={done === total ? "var(--st-done)" : "var(--clay)"}
        strokeWidth="2.25"
        strokeLinecap="round"
        strokeDasharray={c}
        strokeDashoffset={c * (1 - done / total)}
        className="transition-[stroke-dashoffset] duration-300"
      />
    </svg>
  );
}

function TaskCard({
  task,
  order,
  picked,
  pending,
  onOpen,
  onPick,
  onTarget,
  onMove,
  onCancel,
  boardRef,
}: {
  task: Task;
  order: readonly Status[];
  picked: Picked | null;
  pending: boolean;
  onOpen: (task: Task) => void;
  onPick: (value: Picked) => void;
  onTarget: (status: Status) => void;
  onMove: (id: string, status: Status) => void;
  onCancel: () => void;
  boardRef: React.RefObject<HTMLDivElement | null>;
}) {
  const gesture = React.useRef<Gesture | null>(null);
  const suppressClick = React.useRef(0);
  const mine = picked?.id === task.id;

  function key(event: React.KeyboardEvent) {
    if (
      event.target !== event.currentTarget &&
      !(event.target instanceof HTMLButtonElement && event.target.dataset.grip)
    )
      return;

    if (!picked && (event.key === " " || event.key === "Enter")) {
      event.preventDefault();
      onPick({ id: task.id, target: task.status, keyboard: true });
    } else if (picked?.id === task.id && picked.keyboard) {
      const index = order.indexOf(picked.target);

      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();

        const next =
          order[
            Math.max(0, Math.min(order.length - 1, index + (event.key === "ArrowRight" ? 1 : -1)))
          ];

        onTarget(next);
        boardRef.current
          ?.querySelector(`[data-status="${next}"]`)
          ?.scrollIntoView({ block: "nearest", inline: "nearest" });
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        onMove(task.id, picked.target);
      } else if (event.key === "Escape") {
        event.preventDefault();
        onCancel();
      }
    }
  }

  return (
    <Card
      tabIndex={0}
      draggable={!pending}
      data-task={task.id}
      aria-describedby="move-instructions"
      aria-disabled={pending}
      className={cn(
        "group relative cursor-grab p-3.5 transition-[box-shadow,border-color,opacity,translate] duration-150 ease-[var(--ease)] hover:-translate-y-px hover:border-border-strong hover:shadow-lift focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-sunken focus-visible:outline-none",
        mine && !picked.keyboard && "border-dashed opacity-50 shadow-none",
        mine && picked.keyboard && "ring-2 ring-clay ring-offset-2 ring-offset-sunken",
        pending && "pointer-events-none opacity-60",
      )}
      onKeyDown={key}
      onDragStart={(event) => {
        if (gesture.current) {
          event.preventDefault();

          return;
        }

        event.dataTransfer.setData("text/plain", task.id);
        event.dataTransfer.effectAllowed = "move";
        onPick({ id: task.id, target: task.status, keyboard: false });
      }}
      onDragEnd={onCancel}
    >
      <Button
        data-grip="true"
        variant="ghost"
        size="iconSm"
        className="absolute top-2.5 right-2.5 cursor-grab touch-none text-faint opacity-0 group-focus-within:opacity-100 group-hover:opacity-100 focus-visible:opacity-100 active:cursor-grabbing [@media(hover:none)]:opacity-100"
        aria-label={`Move ${task.title}`}
        aria-describedby="move-instructions"
        disabled={pending}
        onPointerDown={(event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          event.currentTarget.focus();
          event.currentTarget.setPointerCapture(event.pointerId);
          gesture.current = {
            id: task.id,
            pointer: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            moved: false,
            target: task.status,
          };
        }}
        onPointerMove={(event) => {
          const current = gesture.current;

          if (!current || current.pointer !== event.pointerId) return;

          if (
            !current.moved &&
            Math.hypot(event.clientX - current.x, event.clientY - current.y) > 6
          ) {
            current.moved = true;
            onPick({ id: task.id, target: task.status, keyboard: false });
          }

          if (!current.moved) return;

          const target = document
            .elementFromPoint(event.clientX, event.clientY)
            ?.closest<HTMLElement>("[data-status]")?.dataset.status;

          current.target = null;

          if (target) {
            const status = Schema.decodeUnknownSync(statusSchema)(target);
            current.target = status;
            onTarget(status);
          }

          const board = boardRef.current;

          if (board) {
            const bounds = board.getBoundingClientRect();

            if (event.clientX < bounds.left + 32) board.scrollLeft -= 16;

            if (event.clientX > bounds.right - 32) board.scrollLeft += 16;
          }
        }}
        onPointerUp={(event) => {
          const current = gesture.current;

          if (!current || current.pointer !== event.pointerId) return;
          gesture.current = null;
          event.currentTarget.releasePointerCapture(event.pointerId);

          if (current.moved) {
            suppressClick.current = performance.now() + 200;

            if (current.target) onMove(task.id, current.target);
            else onCancel();
          } else onPick({ id: task.id, target: task.status, keyboard: true });
        }}
        onPointerCancel={() => {
          gesture.current = null;
          onCancel();
        }}
      >
        <GripVertical data-icon="inline-start" />
      </Button>
      {taskNumber(task) ? (
        <span className="mb-1 block text-micro text-muted-foreground tabular-nums">
          #{taskNumber(task)}
        </span>
      ) : null}
      <button
        type="button"
        data-open-task={task.id}
        className={cn(
          "block w-full cursor-pointer pr-7 text-left text-body leading-snug font-medium decoration-clay/40 underline-offset-4 line-clamp-3 hover:underline",
          task.status === "done" ? "text-muted-foreground" : "text-foreground",
        )}
        onClick={() => {
          if (performance.now() >= suppressClick.current) onOpen(task);
        }}
      >
        {task.title}
      </button>
      <div className="mt-2.5 flex flex-wrap items-center gap-x-2.5 gap-y-1.5 text-micro text-muted-foreground">
        {stageOf(task) ? (
          <span className="inline-flex items-center gap-1.5">
            <StageRail task={task} />
            <span
              data-stage={stageOf(task)}
              className="capitalize"
              aria-label={`Stage: ${stageOf(task)}`}
            >
              {stageOf(task)}
            </span>
          </span>
        ) : null}
        <span title={`Updated ${task.updated}`}>{ago(task.updated)}</span>
        {task.subtasks.total ? (
          <SubtaskMeter done={task.subtasks.done} total={task.subtasks.total} className="ml-auto" />
        ) : null}
      </div>
      <BlockerNote task={task} className="mt-2.5" />
      {mine && picked.keyboard ? (
        <p className="mt-3 flex items-center gap-1.5 text-micro font-medium text-clay-ink">
          <ArrowRight className="size-3" aria-hidden />
          Moving to {statusLabel(picked.target)} · Enter to drop
        </p>
      ) : null}
    </Card>
  );
}

function ContextMenu({
  label,
  title,
  x,
  y,
  onClose,
  children,
}: {
  label: string;
  title: string;
  x: number;
  y: number;
  onClose: () => void;
  children: React.ReactNode;
}) {
  const menu = React.useRef<HTMLDivElement>(null);
  const opener = React.useRef(document.activeElement);
  const [position, setPosition] = React.useState({ left: x, top: y });

  React.useLayoutEffect(() => {
    const element = menu.current;

    if (!element) return;

    const { width, height } = element.getBoundingClientRect();

    setPosition({
      left: Math.max(8, Math.min(x, window.innerWidth - width - 8)),
      top: Math.max(8, Math.min(y, window.innerHeight - height - 8)),
    });
    (
      element.querySelector<HTMLElement>('[aria-checked="true"]') ??
      element.querySelector<HTMLElement>('[role^="menuitem"]')
    )?.focus();
  }, [x, y]);

  React.useEffect(() => {
    const away = (event: Event) => {
      if (!(event.target instanceof Node && menu.current?.contains(event.target))) onClose();
    };

    window.addEventListener("pointerdown", away, true);
    window.addEventListener("scroll", away, true);
    window.addEventListener("resize", onClose);
    window.addEventListener("blur", onClose);

    return () => {
      window.removeEventListener("pointerdown", away, true);
      window.removeEventListener("scroll", away, true);
      window.removeEventListener("resize", onClose);
      window.removeEventListener("blur", onClose);
    };
  });

  React.useEffect(
    () => () => {
      if (opener.current instanceof HTMLElement && opener.current.isConnected)
        opener.current.focus({ preventScroll: true });
    },
    [],
  );

  function key(event: React.KeyboardEvent) {
    // The menu owns the keyboard while open, so number keys must not switch views behind it.
    event.stopPropagation();

    const items = Array.from(
      menu.current?.querySelectorAll<HTMLElement>('[role^="menuitem"]') ?? [],
    );

    const at = items.findIndex((item) => item === document.activeElement);

    const next = new Map([
      ["ArrowDown", (at + 1) % items.length],
      ["ArrowUp", (at - 1 + items.length) % items.length],
      ["Home", 0],
      ["End", items.length - 1],
    ]).get(event.key);

    if (next !== undefined) {
      event.preventDefault();
      items[next]?.focus();
    } else if (event.key === "Escape" || event.key === "Tab") {
      event.preventDefault();
      onClose();
    }
  }

  return (
    <div
      ref={menu}
      role="menu"
      aria-label={label}
      style={position}
      className="fixed z-50 w-56 rounded-lg border border-border bg-card p-1 text-meta shadow-lift"
      onKeyDown={key}
      onContextMenu={(event) => event.preventDefault()}
    >
      <p className="truncate px-2 py-1.5 text-micro text-muted-foreground" title={title}>
        {title}
      </p>
      {children}
    </div>
  );
}

        <Trash2 className="size-3.5" aria-hidden />

                }`}

                  "group flex min-h-11 w-full items-start gap-2.5 rounded-lg px-2.5 py-2.5 text-left transition-colors focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none",

                ) : null}

type Crumb =
  | { kind: "task"; key: string; index: number; task: Task }
  | { kind: "gap"; key: string };

function crumbs(ancestors: Task[], expanded: boolean): Crumb[] {
  const all: Crumb[] = ancestors.map((task, index) => ({
    kind: "task",
    key: task.id,
    index,
    task,
  }));

  if (expanded || all.length <= 3) return all;

  return [all[0], { kind: "gap", key: "gap" }, ...all.slice(-2)];
}

// The server reports each task document's absolute path in the task store.
function taskFilePath(trail: Task[]) {
  return trail.at(-1)?.file ?? "";
}

function sendTargets(file: string) {
  const prompt = encodeURIComponent(`Implement factory task ${file}`);

  return [
    { name: "Claude", href: `claude://code/new?q=${prompt}` },
    { name: "Codex", href: `codex://new?prompt=${prompt}` },
  ];
}

function SendMenu({ file, className }: { file: string; className?: string }) {
  const [open, setOpen] = React.useState(false);
  const rootRef = React.useRef<HTMLDivElement>(null);
  const triggerRef = React.useRef<HTMLButtonElement>(null);

  React.useEffect(() => {
    if (!open) return;

    const away = (event: MouseEvent) => {
      if (event.target instanceof Node && !rootRef.current?.contains(event.target)) setOpen(false);
    };

    const escape = (event: KeyboardEvent) => {
      if (event.key !== "Escape") return;
      setOpen(false);
      triggerRef.current?.focus();
    };

    document.addEventListener("mousedown", away);
    document.addEventListener("keydown", escape);

    return () => {
      document.removeEventListener("mousedown", away);
      document.removeEventListener("keydown", escape);
    };
  }, [open]);

  return (
    <div ref={rootRef} data-send-menu={open ? "" : undefined} className={cn("z-10", className)}>
      <Button
        ref={triggerRef}
        variant="outline"
        size="sm"
        aria-haspopup="menu"
        aria-expanded={open}
        onClick={() => setOpen(!open)}
      >
        <Send aria-hidden />
        Send to
        <ChevronDown className="text-faint" aria-hidden />
      </Button>
      {open ? (
        <div
          role="menu"
          aria-label="Send task to"
          className="absolute top-full right-0 mt-2 w-40 rounded-xl border border-border bg-card p-1.5 shadow-dialog"
        >
          {sendTargets(file).map((target) => (
            <a
              key={target.name}
              role="menuitem"
              href={target.href}
              onClick={() => setOpen(false)}
              className="flex w-full items-center rounded-lg px-3 py-2 text-body transition-colors duration-150 hover:bg-muted focus-visible:bg-muted focus-visible:outline-none"
            >
              {target.name}
            </a>
          ))}
        </div>
      ) : null}
    </div>
  );
}

const tabOfFile = new Map([
  ["INTENT.md", "intent"],
  ["BRIEF.md", "intent"],
  ["DESIGN.md", "design"],
  ["PLAN.md", "plan"],
  ["DEBRIEF.md", "debrief"],
]);

function documentLabel(path: string) {
  if (path === "TASK.md") return "Task";

  return path === "REVIEW.md" ? "Review" : path.replace(/\.md$/, "");
}

// A relative link's target, from the task directory; "" when it climbs out of the task.
function resolveRelative(from: string, href: string) {
  const parts = from.split("/").slice(0, -1);

  for (const segment of (href.split("#")[0] ?? "").split("/")) {
    if (segment === "..") {
      if (!parts.length) return "";

      parts.pop();
    } else if (segment && segment !== ".") parts.push(segment);
  }

  return parts.join("/");
}

function TaskReader({
  root,
  onClose,
  liveKey,
}: {
  root: Task | null;
  onClose: () => void;
  liveKey: number;
}) {
  const [trail, setTrail] = React.useState<Task[]>([]);
  const [dir, setDir] = React.useState<"in" | "out">("in");
  const [expandCrumbs, setExpandCrumbs] = React.useState(false);
  const [tab, setTab] = React.useState("intent");
  const [documents, setDocuments] = React.useState<Documents | null>(null);
  const [error, setError] = React.useState(false);
  const [reloadKey, setReloadKey] = React.useState(0);
  const closeRef = React.useRef<HTMLButtonElement>(null);
  const titleRef = React.useRef<HTMLHeadingElement>(null);
  const opener = React.useRef<string | undefined>(undefined);
  const levelChanged = React.useRef(false);
  const wide = useMediaQuery("(min-width:1024px)");
  const task = trail[trail.length - 1] ?? null;
  const parent = trail.length > 1 ? trail[trail.length - 2] : null;
  const subs = documents?.subtasks ?? [];

  React.useEffect(() => {
    if (root) {
      opener.current = root.id;
      setTrail([root]);
    } else setTrail([]);
  }, [root?.id]);
  React.useEffect(() => {
    if (wide && tab === "subtasks") setTab("intent");
  }, [wide]);
  React.useEffect(() => {
    if (!task) return;
    const controller = new AbortController();
    setTab("intent");
    setDocuments(null);
    setError(false);
    setExpandCrumbs(false);

    if (levelChanged.current) {
      levelChanged.current = false;
      requestAnimationFrame(() => titleRef.current?.focus());
    }

    request(api(`/api/tasks/${task.id.split("/").map(encodeURIComponent).join("/")}`), {
      signal: controller.signal,
    })
      .then((value) => {
        if (!controller.signal.aborted)
          setDocuments(Schema.decodeUnknownSync(documentsSchema)(value));
      })
      .catch(() => {
        if (!controller.signal.aborted) setError(true);
      });

    return () => controller.abort();
  }, [task?.id, reloadKey]);
  React.useEffect(() => {
    if (!task || liveKey === 0) return;
    const controller = new AbortController();

    request(api(`/api/tasks/${task.id.split("/").map(encodeURIComponent).join("/")}`), {
      signal: controller.signal,
    })
      .then((value) => {
        if (!controller.signal.aborted)
          setDocuments(Schema.decodeUnknownSync(documentsSchema)(value));
      })
      .catch(() => undefined);

    return () => controller.abort();
  }, [liveKey]);

  function go(index: number) {
    levelChanged.current = true;
    setDir("out");
    setTrail(trail.slice(0, index + 1));
  }

  function drill(subtask: Task) {
    levelChanged.current = true;
    setDir("in");
    setTrail([...trail, subtask]);
  }

  // Links between task documents switch tabs instead of leaving the board.
  function followLink(event: React.MouseEvent, from: string) {
    const href =
      event.target instanceof Element ? event.target.closest("a")?.getAttribute("href") : null;

    if (!href || !/^[\w./-]+\.md(#[\w-]*)?$/.test(href)) return;

    event.preventDefault();

    const target = resolveRelative(from, href);
    const next = tabOfFile.get(target) ?? target;

    if (tabOfFile.has(target) || documents?.others.some((other) => other.path === target))
      setTab(next);
  }

  const document_ = (html: string, path: string) => (
    <article
      className="reader px-8 py-8 lg:px-12"
      onClick={(event) => followLink(event, path)}
      dangerouslySetInnerHTML={{ __html: html }}
    />
  );

  return (
    <DialogPrimitive.Root
      open={Boolean(root)}
      onOpenChange={(open) => {
        if (!open) onClose();
      }}
    >
      <DialogContent
        onOpenAutoFocus={(event) => {
          event.preventDefault();
          closeRef.current?.focus();
        }}
        onEscapeKeyDown={(event) => {
          if (document.querySelector("[data-send-menu]")) event.preventDefault();
        }}
        onCloseAutoFocus={(event) => {
          event.preventDefault();
          document
            .querySelector<HTMLButtonElement>(`[data-open-task="${opener.current}"]`)
            ?.focus();
        }}
      >
        <header className="shrink-0 px-8 pt-6 pr-16 pb-5 lg:pr-72">
          {parent ? (
            <div className="mb-2 flex items-center gap-1">
              <Button
                variant="ghost"
                size="iconSm"
                aria-label={`Back to ${parent.title}`}
                onClick={() => go(trail.length - 2)}
              >
                <ArrowLeft />
              </Button>
              <nav aria-label="Parent tasks" className="min-w-0">
                <ol className="flex min-w-0 items-center gap-1 text-meta text-muted-foreground">
                  {crumbs(trail.slice(0, -1), expandCrumbs).map((crumb, i) => (
                    <li key={crumb.key} className="flex min-w-0 items-center gap-1">
                      {i > 0 ? (
                        <ChevronRight className="size-3.5 shrink-0 text-faint" aria-hidden />
                      ) : null}
                      {crumb.kind === "gap" ? (
                        <button
                          type="button"
                          className="rounded px-1 hover:bg-muted hover:text-foreground"
                          aria-label="Show all parent tasks"
                          onClick={() => setExpandCrumbs(true)}
                        >
                          …
                        </button>
                      ) : (
                        <button
                          type="button"
                          className="max-w-[22ch] truncate rounded px-1 hover:bg-muted hover:text-foreground"
                          title={crumb.task.title}
                          onClick={() => go(crumb.index)}
                        >
                          {crumb.task.title}
                        </button>
                      )}
                    </li>
                  ))}
                </ol>
              </nav>
            </div>
          ) : null}
          <DialogPrimitive.Title
            ref={titleRef}
            tabIndex={-1}
            className="font-serif text-title font-normal text-balance focus:outline-none"
          >
            {task?.title}
          </DialogPrimitive.Title>
          {task ? (
            <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-meta text-muted-foreground">
              <span className={chip({ status: task.status })}>
                <StatusIcon status={task.status} className="size-3" />
                {statusLabel(task.status)}
              </span>
              <span>Updated {task.updated}</span>
              {task.subtasks.total ? (
                <span className="inline-flex items-center gap-2">
                  <ProgressRing done={task.subtasks.done} total={task.subtasks.total} />
                  {task.subtasks.done} of {task.subtasks.total} subtasks done
                </span>
              ) : null}
            </div>
          ) : null}
          <DialogPrimitive.Close asChild>
            <Button
              ref={closeRef}
              variant="ghost"
              size="icon"
              className="absolute top-4 right-4"
              aria-label="Close task"
            >
              <X data-icon="inline-start" />
            </Button>
          </DialogPrimitive.Close>
          {task ? (
            <SendMenu file={taskFilePath(trail)} className="absolute top-14 right-4" />
          ) : null}
        </header>
        <DialogPrimitive.Description className="sr-only">
          Task intent, design, implementation plan, debrief and subtasks.
        </DialogPrimitive.Description>
        <TabsPrimitive.Root
          value={tab}
          onValueChange={setTab}
          className="flex min-h-0 flex-1 flex-col"
        >
          <TabsList aria-label="Task documents">
            <TabsTrigger value="intent">Intent</TabsTrigger>
            <TabsTrigger value="design">Design</TabsTrigger>
            <TabsTrigger value="plan">Plan</TabsTrigger>
            <TabsTrigger value="debrief">Debrief</TabsTrigger>
            {documents?.others.map((other) => (
              <TabsTrigger key={other.path} value={other.path}>
                {documentLabel(other.path)}
              </TabsTrigger>
            ))}
            {!wide && subs.length ? (
              <TabsTrigger value="subtasks">
                Subtasks
                <span className="rounded-full bg-muted px-1.5 text-micro text-muted-foreground tabular-nums">
                  {subs.length}
                </span>
              </TabsTrigger>
            ) : null}
          </TabsList>
          <div key={task?.id} data-dir={dir} className="level flex min-h-0 flex-1">
            <div className="flex min-h-0 min-w-0 flex-1 flex-col">
              {error ? (
                <div className="px-8 py-8">
                  <Alert onRetry={() => setReloadKey((value) => value + 1)}>
                    Could not load task documents.
                  </Alert>
                </div>
              ) : !documents ? (
                <div role="status" aria-label="Loading documents" className="space-y-3 px-8 py-8">
                  {["40%", "92%", "85%", "60%"].map((width) => (
                    <div
                      key={width}
                      className="h-3 animate-pulse rounded bg-muted"
                      style={{ width }}
                    />
                  ))}
                </div>
              ) : (
                <>
                  {(["intent", "design", "plan", "debrief"] as const).map((name) => (
                    <TabsPrimitive.Content
                      key={name}
                      value={name}
                      className="min-h-0 flex-1 overflow-auto"
                    >
                      {document_(documents[name], `${name.toUpperCase()}.md`)}
                    </TabsPrimitive.Content>
                  ))}
                  {documents.others.map((other) => (
                    <TabsPrimitive.Content
                      key={other.path}
                      value={other.path}
                      className="min-h-0 flex-1 overflow-auto"
                    >
                      {document_(other.html, other.path)}
                    </TabsPrimitive.Content>
                  ))}
                  {!wide && subs.length ? (
                    <TabsPrimitive.Content
                      value="subtasks"
                      className="min-h-0 flex-1 overflow-auto px-5 py-6"
                    >
                      <SubtaskPanel subtasks={subs} onOpen={drill} tone="page" />
                    </TabsPrimitive.Content>
                  ) : null}
                </>
              )}
            </div>
            {wide && subs.length ? (
              <aside
                aria-label="Subtasks"
                className="w-80 shrink-0 overflow-auto border-l border-border bg-sunken/60 px-3 py-5"
              >
                <SubtaskPanel subtasks={subs} onOpen={drill} tone="rail" />
              </aside>
            ) : null}
          </div>
        </TabsPrimitive.Root>
      </DialogContent>
    </DialogPrimitive.Root>
  );
}

type Theme = "system" | "light" | "dark";

function readTheme(): Theme {
  try {
    const stored = localStorage.getItem("factory-theme");

    return stored === "light" || stored === "dark" ? stored : "system";
  } catch {
    return "system";
  }
}

function ThemeToggle() {
  const [theme, setTheme] = React.useState<Theme>(readTheme);
  const order: Theme[] = ["system", "light", "dark"];
  const next = order[(order.indexOf(theme) + 1) % order.length];
  const icons = { system: Monitor, light: Sun, dark: Moon };
  const Icon = icons[theme];

  function choose(value: Theme) {
    setTheme(value);

    try {
      if (value === "system") localStorage.removeItem("factory-theme");
      else localStorage.setItem("factory-theme", value);
    } catch {
      // The choice still applies to this page load.
    }

    if (value === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = value;
  }

  return (
    <Button
      variant="ghost"
      size="icon"
      aria-label={`Theme: ${theme}. Switch to ${next}.`}
      title={`Theme: ${theme}`}
      onClick={() => choose(next)}
    >
      <Icon />
    </Button>
  );
}

// Display only: the home prefix collapses to ~ and long middles are elided.
function shortPath(path: string) {
  const home = path.replace(/^(\/Users|\/home)\/[^/]+/, "~");
  const parts = home.split("/");

  return parts.length > 4 ? [parts[0], parts[1], "…", ...parts.slice(-2)].join("/") : home;
}

            <Button

type TaskViewProps = {
  tasks: readonly Task[];
  onOpen: (task: Task) => void;
};

type Lifted = { id: ColumnId; keyboard: boolean };

type ColumnGesture = {
  id: ColumnId;
  pointer: number;
  startX: number;
  clientX: number;
  grab: number;
  moved: boolean;
  onGrip: boolean;
};

const liftEase = "cubic-bezier(.165,.84,.44,1)";

function BoardView({
  board,
  tasks,
  queue,
  stale,
  busy,
  order,
  picked,
  pending,
  boardRef,
  canDrop,
  onDropCard,
  onOrder,
  onAnnounce,
  onOpen,
  onPick,
  onTarget,
  onMove,
  onCancel,
}: {
  board: Board | null;
  tasks: readonly Task[];
  queue: readonly IndexedQueueItem[];
  stale: boolean;
  busy: boolean;
  order: readonly ColumnId[];
  picked: Picked | null;
  pending: boolean;
  boardRef: React.RefObject<HTMLDivElement | null>;
  canDrop: () => boolean;
  onDropCard: (status: Status) => boolean;
  onOrder: (order: readonly ColumnId[]) => void;
  onAnnounce: (message: string) => void;
  onOpen: (task: Task) => void;
  onPick: (value: Picked) => void;
  onTarget: (status: Status) => void;
  onMove: (id: string, status: Status) => void;
  onCancel: () => void;
}) {
  const [preview, setPreview] = React.useState<readonly ColumnId[] | null>(null);
  const [lifted, setLifted] = React.useState<Lifted | null>(null);
  const gesture = React.useRef<ColumnGesture | null>(null);
  const lefts = React.useRef(new Map<ColumnId, number>());
  const reducedMotion = useMediaQuery("(prefers-reduced-motion: reduce)");
  const shown = preview ?? order;

  const statusColumns = shown.flatMap((id) => (id === "queue" ? [] : [id]));

  const columnOf = (id: ColumnId) =>
    boardRef.current?.querySelector<HTMLElement>(`[data-column="${id}"]`) ?? null;

  // Layout positions ignore transforms, so reading them mid-animation stays stable.
  function measure() {
    for (const id of shown) {
      const element = columnOf(id);

      if (element) lefts.current.set(id, element.offsetLeft);
    }
  }

  function boardX(clientX: number) {
    const element = boardRef.current;

    return element ? clientX - element.getBoundingClientRect().left + element.scrollLeft : clientX;
  }

  function follow() {
    const current = gesture.current;
    const element = current?.moved ? columnOf(current.id) : null;

    if (current && element)
      element.style.transform = `translateX(${boardX(current.clientX) - current.grab - element.offsetLeft}px)`;
  }

  function slide(element: HTMLElement, from: string) {
    if (reducedMotion || !("animate" in element)) return;

    element.animate([{ transform: from }, { transform: "none" }], {
      duration: 180,
      easing: liftEase,
    });
  }

  const shownKey = shown.join();

  React.useLayoutEffect(() => {
    for (const id of shown) {
      const element = columnOf(id);
      const before = lefts.current.get(id);

      if (!element) continue;

      if (before !== undefined && before !== element.offsetLeft && id !== gesture.current?.id)
        slide(element, `translateX(${before - element.offsetLeft}px)`);

      lefts.current.set(id, element.offsetLeft);
    }

    follow();

    if (lifted?.keyboard) {
      const grip = boardRef.current?.querySelector<HTMLElement>(
        `[data-column-grip="${lifted.id}"]`,
      );

      grip?.focus({ preventScroll: true });
      columnOf(lifted.id)?.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }, [shownKey]);

  function positions(list: readonly ColumnId[]) {
    return list.map(columnLabel).join(", ");
  }

  function finish(next: readonly ColumnId[] | null) {
    setPreview(null);
    setLifted(null);

    if (next && next.join() !== order.join()) {
      onOrder(next);
      onAnnounce(`Columns reordered: ${positions(next)}.`);
    } else onAnnounce("Column order unchanged.");
  }

  function lift(id: ColumnId) {
    measure();
    setPreview(order);
    setLifted({ id, keyboard: true });
    onAnnounce(
      `${columnLabel(id)} column lifted. Use left and right arrows to move it, Enter to drop, Escape to cancel.`,
    );
  }

  function release(cancelled: boolean) {
    const current = gesture.current;

    gesture.current = null;

    if (!current?.moved) return;

    const element = columnOf(current.id);

    if (element) {
      const from = element.style.transform;

      element.style.transform = "";
      slide(element, from);
    }

    finish(cancelled ? null : shown);
  }

  function startColumn(event: React.PointerEvent<HTMLElement>, id: ColumnId) {
    if (event.button !== 0 || picked || lifted?.keyboard) return;

    const onGrip =
      event.target instanceof Element && event.target.closest("[data-column-grip]") !== null;

    // Touch keeps the header scrollable; only the grip starts a touch drag.
    if (!onGrip && event.pointerType !== "mouse") return;

    const element = columnOf(id);

    if (!element) return;

    event.preventDefault();

    if (onGrip) boardRef.current?.querySelector<HTMLElement>(`[data-column-grip="${id}"]`)?.focus();

    event.currentTarget.setPointerCapture(event.pointerId);
    measure();
    gesture.current = {
      id,
      pointer: event.pointerId,
      startX: event.clientX,
      clientX: event.clientX,
      grab: boardX(event.clientX) - element.offsetLeft,
      moved: false,
      onGrip,
    };
  }

  function moveColumn(event: React.PointerEvent<HTMLElement>) {
    const current = gesture.current;
    const element = boardRef.current;

    if (!current || !element || current.pointer !== event.pointerId) return;

    current.clientX = event.clientX;

    if (!current.moved && Math.abs(event.clientX - current.startX) > 6) {
      current.moved = true;
      setPreview(order);
      setLifted({ id: current.id, keyboard: false });
      onAnnounce(`Moving ${columnLabel(current.id)} column.`);
    }

    if (!current.moved) return;

    const bounds = element.getBoundingClientRect();

    if (event.clientX < bounds.left + 32) element.scrollLeft -= 16;

    if (event.clientX > bounds.right - 32) element.scrollLeft += 16;

    const offsets = shown.map((id) => columnOf(id)?.offsetLeft ?? 0);
    const first = Math.min(...offsets);
    const step = (Math.max(...offsets) - first) / Math.max(1, shown.length - 1);

    if (step > 0) {
      const slot = Math.max(
        0,
        Math.min(
          shown.length - 1,
          Math.round((boardX(event.clientX) - current.grab - first) / step),
        ),
      );

      if (slot !== shown.indexOf(current.id)) setPreview(place(shown, current.id, slot));
    }

    follow();
  }

  function endColumn(event: React.PointerEvent<HTMLElement>) {
    const current = gesture.current;

    if (!current || current.pointer !== event.pointerId) return;

    event.currentTarget.releasePointerCapture(event.pointerId);

    if (!current.moved) {
      gesture.current = null;

      if (current.onGrip) lift(current.id);

      return;
    }

    release(false);
  }

  function columnKey(event: React.KeyboardEvent, id: ColumnId) {
    const space = event.key === " " || event.key === "Enter";

    if (!lifted && space) {
      event.preventDefault();
      lift(id);
    } else if (lifted?.id === id && lifted.keyboard) {
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();

        const slot = shown.indexOf(id) + (event.key === "ArrowRight" ? 1 : -1);

        if (slot >= 0 && slot < shown.length) {
          setPreview(place(shown, id, slot));
          onAnnounce(`${columnLabel(id)} column, position ${slot + 1} of ${shown.length}.`);
        }
      } else if (space) {
        event.preventDefault();
        finish(shown);
      } else if (event.key === "Escape") {
        event.preventDefault();
        finish(null);
      }
    }
  }

  const dragging = lifted && !lifted.keyboard;

  React.useEffect(() => {
    if (!lifted?.keyboard) return;

    const away = (event: PointerEvent) => {
      if (event.target instanceof Element && !event.target.closest("[data-column-grip]"))
        finish(null);
    };

    window.addEventListener("pointerdown", away);

    return () => window.removeEventListener("pointerdown", away);
  });

  React.useEffect(() => {
    if (!dragging) return;

    const escape = (event: KeyboardEvent) => {
      if (event.key === "Escape") release(true);
    };

    window.addEventListener("keydown", escape);

    return () => window.removeEventListener("keydown", escape);
  });

  return (
    <div
      ref={boardRef}
      data-board="true"
      hidden={board !== null && board.projects.length === 0}
      className={cn(
        "relative grid h-full grid-cols-[repeat(5,minmax(264px,1fr))] grid-rows-[minmax(0,1fr)] gap-3 overflow-x-auto pb-4 transition-opacity [scrollbar-gutter:stable]",
        stale && "opacity-60",
      )}
      aria-busy={busy || !board || stale}
    >
      {shown.map((id) => {
        const label = columnLabel(id);
        const inColumn = tasks.filter((task) => task.status === id);
        const count = id === "queue" ? queue.length : inColumn.length;
        const dropping = picked?.target === id;
        const isLifted = lifted?.id === id;

        return (
          <section
            key={id}
            data-column={id}
            data-status={id === "queue" ? undefined : id}
            data-lifted={isLifted ? (lifted.keyboard ? "keyboard" : "pointer") : undefined}
            aria-label={label}
            className={cn(
              "flex min-h-64 flex-col rounded-2xl bg-sunken transition-[background-color,box-shadow] duration-150",
              dropping &&
                "bg-clay-tint/60 outline-2 -outline-offset-2 outline-dashed outline-clay/60",
              isLifted && "relative z-20 shadow-drag",
              isLifted && lifted.keyboard && "ring-2 ring-clay",
            )}
            onDragOver={(event) => {
              if (id !== "queue" && canDrop()) {
                event.preventDefault();
                event.dataTransfer.dropEffect = "move";
                onTarget(id);
              }
            }}
            onDrop={(event) => {
              if (id !== "queue" && onDropCard(id)) event.preventDefault();
            }}
          >
            <div
              data-column-head={id}
              className="group/col flex cursor-grab items-center gap-2 px-3 pt-2.5 pb-2 select-none active:cursor-grabbing"
              onPointerDown={(event) => startColumn(event, id)}
              onPointerMove={moveColumn}
              onPointerUp={endColumn}
              onPointerCancel={() => release(true)}
            >
              {id === "queue" ? (
                <Inbox className="size-3.5 text-muted-foreground" aria-hidden />
              ) : (
                <StatusIcon status={id} />
              )}
              <h2 className="text-meta font-medium text-foreground">{label}</h2>
              <span className="text-micro text-muted-foreground tabular-nums">{count}</span>
              <Button
                data-column-grip={id}
                variant="ghost"
                size="iconSm"
                className="ml-auto -mr-1 cursor-grab touch-none text-faint opacity-0 group-focus-within/col:opacity-100 group-hover/col:opacity-100 focus-visible:opacity-100 active:cursor-grabbing [@media(hover:none)]:opacity-100"
                aria-label={`Reorder ${label} column`}
                aria-describedby="column-instructions"
                aria-pressed={isLifted}
                onKeyDown={(event) => columnKey(event, id)}
              >
                <GripVertical />
              </Button>
            </div>
            {isLifted && lifted.keyboard ? (
              <p className="px-3 pb-2 text-micro font-medium text-clay-ink">
                Arrows move · Enter drops · Esc cancels
              </p>
            ) : null}
            <div className="flex min-h-0 flex-1 flex-col gap-2 overflow-y-auto p-2 pt-0.5">
              {!board
                ? [0, 1].map((n) => (
                    <div
                      key={n}
                      className="h-[92px] shrink-0 animate-pulse rounded-xl border border-border bg-card/60"
                    />
                  ))
                : null}
              {id === "queue"
                ? queue.map((item) => <QueueCard key={`${item.text}-${item.index}`} item={item} />)
                : null}
              {inColumn.map((task) => (
                <TaskCard
                  key={task.id}
                  task={task}
                  order={statusColumns}
                  picked={picked}
                  pending={pending}
                  onOpen={onOpen}
                  onPick={onPick}
                  onTarget={onTarget}
                  onMove={onMove}
                  onCancel={onCancel}
                  boardRef={boardRef}
                />
              ))}
              {board && !count ? (
                <p
                  className={cn(
                    "rounded-xl border border-dashed border-border-strong px-4 py-8 text-center text-meta text-muted-foreground",
                    dropping && "border-clay/50 text-clay-ink",
                  )}
                >
                  {dropping ? "Drop here" : id === "queue" ? "Nothing queued" : "No tasks"}
                </p>
              ) : null}
            </div>
          </section>
        );
      })}
    </div>
  );
}

function StationTrack({ task }: { task: Task }) {
  const stage = stageOf(task);
  const at = stage ? stages.indexOf(stage) : -1;

  return (
    <div
      role="img"
      aria-label={stage ? `At ${stage}, ${statusLabel(task.status)}` : "No stage recorded"}
      className="relative grid grid-cols-6 items-center py-3"
    >
      <span
        className={cn(
          "absolute inset-x-[8.33%] top-1/2 border-t",
          at < 0 ? "border-dashed border-border-strong" : "border-border-strong",
        )}
      />
      {at > 0 ? (
        <span
          className={cn(
            "absolute left-[8.33%] top-1/2 h-0.5 -translate-y-1/2",
            statusFill[task.status],
          )}
          style={{ width: `${(at / stages.length) * 100}%` }}
        />
      ) : null}
      {stages.map((name, index) => (
        <span key={name} className="relative flex justify-center">
          {index === at ? (
            <span className="rounded-full bg-background p-0.5 group-hover/row:bg-sunken">
              <StatusIcon status={task.status} className="size-4" />
            </span>
          ) : (
            <span
              className={cn(
                "rounded-full",
                index < at ? cn("size-2", statusFill[task.status]) : "size-1.5 bg-border-strong",
              )}
            />
          )}
        </span>
      ))}
    </div>
  );
}

function PipelineView({ tasks, onOpen }: TaskViewProps) {
  const grid =
    "grid grid-cols-1 md:grid-cols-[minmax(230px,1.15fr)_minmax(420px,3fr)_64px] md:items-center md:gap-4";

  return (
    <div className="pb-8 md:min-w-[760px]">
      <div className={cn(grid, "sticky top-0 z-10 bg-background px-3 pt-1 pb-2")}>
        <span className="text-micro font-medium text-muted-foreground max-md:hidden">Task</span>
        <div className="grid grid-cols-6">
          {stages.map((stage) => (
            <span
              key={stage}
              className="text-center text-micro font-medium capitalize md:text-meta"
            >
              {stage}
              <span className="ml-1.5 text-micro font-normal text-muted-foreground tabular-nums max-md:hidden">
                {tasks.filter((task) => stageOf(task) === stage).length}
              </span>
            </span>
          ))}
        </div>
        <span className="text-right text-micro font-medium text-muted-foreground max-md:hidden">
          Moved
        </span>
      </div>
      {attentionOrder.map((status) => {
        const group = tasks
          .filter((task) => task.status === status)
          .sort(
            (a, b) =>
              (b.stage ? stages.indexOf(b.stage) : -1) - (a.stage ? stages.indexOf(a.stage) : -1) ||
              a.id.localeCompare(b.id),
          );

        if (!group.length) return null;

        return (
          <section key={status} aria-label={statusLabel(status)} className="mt-4 first:mt-1">
            <h2 className="flex items-center gap-2 px-3 pb-1.5 text-meta font-medium">
              <StatusIcon status={status} />
              {statusLabel(status)}
              <span className="text-micro font-normal text-muted-foreground tabular-nums">
                {group.length}
              </span>
            </h2>
            <ul className="border-t border-border">
              {group.map((task) => (
                <li
                  key={task.id}
                  data-pipeline-task={task.id}
                  className={cn(
                    grid,
                    "group/row border-b border-border px-3 transition-colors duration-100 hover:bg-sunken max-md:pt-2.5",
                  )}
                >
                  <div className="flex min-w-0 items-baseline gap-2.5">
                    <span className="w-7 shrink-0 text-micro text-muted-foreground tabular-nums">
                      {taskNumber(task)}
                    </span>
                    <OpenTask
                      task={task}
                      onOpen={onOpen}
                      className={cn(
                        "truncate text-sm font-medium",
                        status === "done" && "font-normal text-muted-foreground",
                      )}
                    />
                  </div>
                  <StationTrack task={task} />
                  <span
                    className="text-right text-micro text-muted-foreground tabular-nums max-md:hidden"
                    title={`Updated ${task.updated}`}
                  >
                    {ago(task.updated)}
                  </span>
                </li>
              ))}
            </ul>
          </section>
        );
      })}
    </div>
  );
}

const quietAfterDays = 3;

function FocusAction({
  label,
  icon: Icon,
  disabled,
  onClick,
}: {
  label: string;
  icon: React.ComponentType<{ "aria-hidden"?: boolean }>;
  disabled: boolean;
  onClick: () => void;
}) {
  return (
    <Button variant="ghost" size="sm" disabled={disabled} onClick={onClick}>
      <Icon aria-hidden />
      {label}
    </Button>
  );
}

function FocusRow({
  task,
  pending,
  onOpen,
  onMove,
}: {
  task: Task;
  pending: boolean;
  onOpen: (task: Task) => void;
  onMove: (id: string, status: Status) => void;
}) {
  const quiet = task.status === "inprogress" ? (daysSince(task.updated) ?? 0) : 0;

  return (
    <li
      data-task={task.id}
      tabIndex={-1}
      className="group/row flex flex-wrap items-center gap-x-3 gap-y-1 rounded-lg px-3 py-2 transition-colors duration-100 hover:bg-sunken"
    >
      <StatusIcon status={task.status} />
      <div className="min-w-[200px] flex-1">
        <OpenTask
          task={task}
          onOpen={onOpen}
          className={cn(
            "block text-body leading-snug font-medium",
            task.status === "done" && "font-normal text-muted-foreground",
          )}
        />
        <p className="mt-0.5 flex flex-wrap items-center gap-x-2 text-micro text-muted-foreground tabular-nums">
          {taskNumber(task) ? <span>#{taskNumber(task)}</span> : null}
          {stageOf(task) ? <span className="capitalize">{stageOf(task)}</span> : null}
          <span title={`Updated ${task.updated}`}>{ago(task.updated)}</span>
          {quiet >= quietAfterDays ? (
            <span className={chip({ status: "blocked" })}>Quiet {quiet}d</span>
          ) : null}
        </p>
        <BlockerNote task={task} className="mt-1.5" />
      </div>
      <div className="flex items-center gap-1 opacity-0 transition-opacity duration-100 group-focus-within/row:opacity-100 group-hover/row:opacity-100 [@media(hover:none)]:opacity-100">
        {task.status === "backlog" ? (
          <FocusAction
            label="Start"
            icon={Play}
            disabled={pending}
            onClick={() => onMove(task.id, "inprogress")}
          />
        ) : null}
        {task.status === "blocked" ? (
          <FocusAction
            label="Resume"
            icon={Play}
            disabled={pending}
            onClick={() => onMove(task.id, "inprogress")}
          />
        ) : null}
        {task.status === "inprogress" ? (
          <>
            <FocusAction
              label="Block"
              icon={Pause}
              disabled={pending}
              onClick={() => onMove(task.id, "blocked")}
            />
            <FocusAction
              label="Done"
              icon={Check}
              disabled={pending}
              onClick={() => onMove(task.id, "done")}
            />
          </>
        ) : null}
      </div>
    </li>
  );
}

function focusHeadline(blocked: number, active: number, next: Task | undefined) {
  if (blocked > 0)
    return blocked === 1
      ? "One task is waiting on a decision."
      : `${blocked} tasks are waiting on a decision.`;

  if (active > 0)
    return active === 1
      ? "One task is in progress, and nothing is stuck."
      : `${active} tasks are in progress, and nothing is stuck.`;

  if (next) return `Nothing is running. ${next.title} is next.`;

  return "All clear.";
}

function FocusView({
  tasks,
  pending,
  onOpen,
  onMove,
}: TaskViewProps & { pending: boolean; onMove: (id: string, status: Status) => void }) {
  const stageRank = (task: Task) => (task.stage ? stages.indexOf(task.stage) : -1);
  const blocked = tasks.filter((task) => task.status === "blocked");

  const active = tasks
    .filter((task) => task.status === "inprogress")
    .sort((a, b) => a.updated.localeCompare(b.updated));

  const backlog = tasks
    .filter((task) => task.status === "backlog")
    .sort((a, b) => stageRank(b) - stageRank(a) || a.id.localeCompare(b.id));

  const shipped = tasks
    .filter((task) => task.status === "done")
    .sort((a, b) => b.updated.localeCompare(a.updated));

  const sections = [
    { title: "Waiting on you", items: blocked, more: 0 },
    { title: "In progress", items: active, more: 0 },
    { title: "Up next", items: backlog.slice(0, 5), more: backlog.length - 5 },
    { title: "Recently done", items: shipped.slice(0, 4), more: shipped.length - 4 },
  ];

  return (
    <div className="mx-auto max-w-[760px] pt-4 pb-12">
      <p className="px-3 font-serif text-title text-balance">
        {focusHeadline(blocked.length, active.length, backlog[0])}
      </p>
      {sections.map((section) =>
        section.items.length ? (
          <section key={section.title} aria-label={section.title} className="mt-8">
            <h2 className="flex items-center gap-2 px-3 pb-1 text-meta font-medium text-muted-foreground">
              {section.title}
              <span className="text-micro font-normal tabular-nums">
                {section.items.length + Math.max(0, section.more)}
              </span>
            </h2>
            <ul>
              {section.items.map((task) => (
                <FocusRow
                  key={task.id}
                  task={task}
                  pending={pending}
                  onOpen={onOpen}
                  onMove={onMove}
                />
              ))}
            </ul>
            {section.more > 0 ? (
              <p className="px-3 pt-1 text-micro text-muted-foreground">{section.more} more</p>
            ) : null}
          </section>
        ) : null,
      )}
    </div>
  );
}

const hillRow = 4;

const hillHeight = (x: number) => 0.9 - 0.56 * Math.exp(-((x - 0.5) ** 2) / (2 * 0.19 ** 2));

const hillCurve = Array.from({ length: 101 }, (_, index) => {
  const x = index / 100;

  return `${x * 1000},${hillHeight(x) * 400}`;
}).join(" L");

type HillDot = { task: Task; x: number; y: number; level: number };

function hillDots(tasks: readonly Task[]): HillDot[] {
  return stages.flatMap((stage, band) => {
    const group = tasks.filter((task) => stageOf(task) === stage);

    return group.map((task, index) => {
      const level = Math.floor(index / hillRow);
      const inRow = level < Math.floor(group.length / hillRow) ? hillRow : group.length % hillRow;
      const x = (band + 0.08 + (0.84 * ((index % hillRow) + 0.5)) / inRow) / stages.length;

      return { task, x, y: hillHeight(x), level };
    });
  });
}

function HillList({
  title,
  dots,
  hot,
  onHot,
  onOpen,
}: {
  title: string;
  dots: readonly HillDot[];
  hot: string;
  onHot: (id: string) => void;
  onOpen: (task: Task) => void;
}) {
  return (
    <section aria-label={title}>
      <h2 className="border-b border-border px-2 pb-2 text-meta font-medium">{title}</h2>

const dayWidth = 26;

function timelineTicks(first: number, last: number) {
  const weekly = last - first <= 84;

  return Array.from({ length: last - first + 1 }, (_, index) => first + index).filter((day) => {
    const date = new Date(day * dayMs);

    return weekly ? date.getUTCDay() === 1 : date.getUTCDate() === 1;
  });
}

function TimelineView({ tasks, onOpen }: TaskViewProps) {
  const scroller = React.useRef<HTMLDivElement>(null);
  const now = today();

  const rows = tasks.flatMap((task) => {
    const start = dayNumber(task.created);
    const moved = dayNumber(task.updated);

    return start === null || moved === null ? [] : [{ task, start, moved }];
  });

  const undated = tasks.length - rows.length;
  const first = Math.min(now, ...rows.map((row) => row.start)) - 1;
  const last = now + 2;
  const span = last - first + 1;
  const ticks = timelineTicks(first, last);
  const percent = (day: number) => `${((day - first) / span) * 100}%`;

  React.useLayoutEffect(() => {
    if (scroller.current) scroller.current.scrollLeft = scroller.current.scrollWidth;
  }, [span]);

  const ordered = [...rows].sort((a, b) => b.start - a.start || b.task.id.localeCompare(a.task.id));

  return (
    <div ref={scroller} className="h-full overflow-auto">
      <div className="min-w-full pb-6" style={{ width: 280 + span * dayWidth }}>
        <div className="sticky top-0 z-20 flex bg-background">
          <span className="sticky left-0 z-10 flex w-[280px] shrink-0 items-end bg-background px-3 pb-2 text-micro font-medium text-muted-foreground">
            Task
          </span>
          <div className="relative h-8 flex-1 border-b border-border">
            {ticks
              .filter((day) => Math.abs(day - now) > 2)
              .map((day) => (
                <span
                  key={day}
                  className="absolute bottom-1.5 -translate-x-1/2 text-micro whitespace-nowrap text-muted-foreground tabular-nums"
                  style={{ left: percent(day) }}
                >
                  {shortDay(day)}
                </span>
              ))}
            <span
              className="absolute bottom-1.5 -translate-x-1/2 text-micro font-medium text-clay-ink"
              style={{ left: percent(now + 1) }}
            >
              Today
            </span>
          </div>
        </div>
        <ul className="relative">
          <li aria-hidden className="pointer-events-none absolute inset-y-0 right-0 left-[280px]">
            {ticks.map((day) => (
              <span
                key={day}
                className="absolute inset-y-0 w-px bg-border"
                style={{ left: percent(day) }}
              />
            ))}
            <span
              className="absolute inset-y-0 w-0.5 bg-clay"
              style={{ left: percent(now + 1) }}
              title="Today"
            />
          </li>
          {ordered.map(({ task, start, moved }) => {
            const end = Math.max(moved, start) + 1;
            const open = task.status !== "done";

            return (
              <li
                key={task.id}
                data-timeline-task={task.id}
                className="group/row relative flex h-10 items-center"
              >
                <div className="sticky left-0 z-10 flex h-full w-[280px] shrink-0 items-center gap-2 bg-background px-3 group-hover/row:bg-sunken">
                  <StatusIcon status={task.status} />
                  <OpenTask task={task} onOpen={onOpen} className="truncate text-sm" />
                </div>
                <div className="relative h-full flex-1">
                  {open && end <= now ? (
                    <span
                      className="absolute top-1/2 border-t-2 border-dotted border-border-strong"
                      style={{
                        left: percent(end),
                        width: `${((now + 1 - end) / span) * 100}%`,
                      }}
                    />
                  ) : null}
                  <span
                    title={`${task.title}: ${shortDay(start)} to ${shortDay(end - 1)}${
                      open ? ", still open" : ""
                    }`}
                    className={cn(
                      "absolute top-1/2 h-5 -translate-y-1/2 rounded-[5px]",
                      statusFill[task.status],
                      task.status === "done" && "opacity-55",
                      task.status === "backlog" && "opacity-40",
                    )}
                    style={{ left: percent(start), width: `${((end - start) / span) * 100}%` }}
                  />
                </div>
              </li>
            );
          })}
        </ul>
        {undated ? (
          <p className="sticky left-0 px-3 pt-3 text-micro text-muted-foreground">
            {undated} task{undated === 1 ? "" : "s"} without valid dates not shown.
          </p>
        ) : null}
      </div>
    </div>
  );
}

const tableColumns = [
  { key: "number", label: "#", className: "w-14" },
  { key: "title", label: "Task", className: "" },
  { key: "status", label: "Status", className: "w-40" },
  { key: "stage", label: "Stage", className: "w-24" },
  { key: "subtasks", label: "Subtasks", className: "w-28" },
  { key: "created", label: "Created", className: "w-28 max-md:hidden" },
  { key: "updated", label: "Updated", className: "w-28" },
  { key: "age", label: "Age", className: "w-20 max-md:hidden" },
] as const;

type TableKey = (typeof tableColumns)[number]["key"];

function tableValue(task: Task, key: TableKey): string | number {
  if (key === "number") return task.id;

  if (key === "title") return task.title.toLowerCase();

  if (key === "status") return attentionOrder.indexOf(task.status);

  if (key === "stage") {
    const stage = stageOf(task);

    return stage ? stages.indexOf(stage) : -1;
  }

  if (key === "subtasks") return task.subtasks.total;

  if (key === "created") return task.created;

  if (key === "updated") return task.updated;

  return daysSince(task.created) ?? -1;
}

function TableView({
  tasks,
  pending,
  onOpen,
  onMove,
}: TaskViewProps & { pending: boolean; onMove: (id: string, status: Status) => void }) {
  const [sort, setSort] = React.useState<{ key: TableKey; ascending: boolean }>({
    key: "updated",
    ascending: false,
  });

  const rows = [...tasks].sort((a, b) => {
    const left = tableValue(a, sort.key);
    const right = tableValue(b, sort.key);
    const order = left < right ? -1 : left > right ? 1 : a.id.localeCompare(b.id);

    return sort.ascending ? order : -order;
  });

  const cell = "px-3 py-2 align-middle tabular-nums";

  return (
    <div className="h-full overflow-auto pb-8">
      <table className="w-full min-w-[720px] border-separate border-spacing-0 text-sm">
        <thead>
          <tr>
            {tableColumns.map((column) => {
              const active = sort.key === column.key;
              const Arrow = sort.ascending ? ArrowUp : ArrowDown;

              return (
                <th
                  key={column.key}
                  scope="col"
                  aria-sort={active ? (sort.ascending ? "ascending" : "descending") : "none"}
                  className={cn(
                    "sticky top-0 z-10 border-b border-border-strong bg-background p-0 text-left",
                    column.className,
                  )}
                >
                  <button
                    type="button"
                    className={cn(
                      "flex w-full cursor-pointer items-center gap-1 px-3 py-2 text-micro font-medium transition-colors duration-100 hover:text-foreground",
                      active ? "text-foreground" : "text-muted-foreground",
                    )}
                    onClick={() =>
                      setSort({
                        key: column.key,
                        ascending: active ? !sort.ascending : column.key === "title",
                      })
                    }
                  >
                    {column.label}
                    {active ? <Arrow className="size-3" aria-hidden /> : null}
                  </button>
                </th>
              );
            })}
          </tr>
        </thead>
        <tbody>
          {rows.map((task) => (
            <tr
              key={task.id}
              data-task={task.id}
              tabIndex={-1}
              className="transition-colors duration-100 hover:bg-sunken"
            >
              <td className={cn(cell, "border-b border-border text-micro text-muted-foreground")}>
                {taskNumber(task)}
              </td>
              <td className={cn(cell, "border-b border-border")}>
                <OpenTask
                  task={task}
                  onOpen={onOpen}
                  className={cn(
                    "font-medium",
                    task.status === "done" && "font-normal text-muted-foreground",
                  )}
                />
              </td>
              <td className={cn(cell, "border-b border-border")}>
                <span className="flex items-center gap-2">
                  <StatusIcon status={task.status} />
                  <select
                    aria-label={`Status of ${task.title}`}
                    value={task.status}
                    disabled={pending}
                    onChange={(event) => {
                      const status = columns.find((column) => column.id === event.target.value);

                      if (status) onMove(task.id, status.id);
                    }}
                    className="cursor-pointer rounded-md bg-transparent py-0.5 text-meta hover:bg-muted disabled:opacity-50"
                  >
                    {columns.map((column) => (
                      <option key={column.id} value={column.id}>
                        {column.label}
                      </option>
                    ))}
                  </select>
                </span>
              </td>
              <td
                className={cn(
                  cell,
                  "border-b border-border text-meta capitalize text-muted-foreground",
                )}
              >
                {stageOf(task) ?? ""}
              </td>
              <td className={cn(cell, "border-b border-border text-meta text-muted-foreground")}>
                {task.subtasks.total ? (
                  <SubtaskMeter done={task.subtasks.done} total={task.subtasks.total} />
                ) : (
                  ""
                )}
              </td>
              <td
                className={cn(
                  cell,
                  "border-b border-border text-meta text-muted-foreground max-md:hidden",
                )}

                {task.created}
              </td>

                {task.updated}
              </td>
              <td
                className={cn(
